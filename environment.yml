name: btw_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.23.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  - scikit-learn>=1.2.0
  - statsmodels>=0.14.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.14.0
  - pyyaml>=6.0
  - joblib>=1.3.0
  - openpyxl>=3.1.0
  - pyarrow>=12.0.0
  - loguru>=0.7.0
  - pytest>=7.4.0
  - pytest-cov>=4.1.0
  - ruff>=0.1.0
  - black>=23.7.0
  - isort>=5.12.0
  - pre-commit>=3.3.0
  - jupyterlab>=4.0.0
  - ipywidgets>=8.0.0
  - papermill>=2.4.0
  - jupytext>=1.15.0
  - networkx>=3.0
  - r-base>=4.3
  - rpy2>=3.5.0
  - bioconductor-deseq2
