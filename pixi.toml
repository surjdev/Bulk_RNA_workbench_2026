[workspace]
name = "btw"
version = "0.1.0"
description = "Downstream Bulk Transcriptomics Workbench for Python & Jupyter"
authors = ["Bioinformatics & Transcriptomics Workbench Team"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tasks]
test = "pytest tests/ -v"
test-cov = "pytest tests/ -v --cov=src/btw --cov-report=term-missing"
lint = "ruff check src/ tests/"
format = "black src/ tests/ && isort src/ tests/"
lab = "jupyter lab --no-browser"

[dependencies]
python = "3.11.*"
numpy = ">=1.23.0"
pandas = ">=2.0.0"
scipy = ">=1.10.0"
scikit-learn = ">=1.2.0"
statsmodels = ">=0.14.0"
matplotlib = ">=3.7.0"
seaborn = ">=0.12.0"
plotly = ">=5.14.0"
pyyaml = ">=6.0"
joblib = ">=1.3.0"
openpyxl = ">=3.1.0"
pyarrow = ">=12.0.0"
loguru = ">=0.7.0"
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
ruff = ">=0.1.0"
black = ">=23.7.0"
isort = ">=5.12.0"
networkx = ">=3.0"
pip = "*"

[pypi-dependencies]
pydeseq2 = ">=0.4.0"
adjustText = ">=0.8.0"
upsetplot = ">=0.8.0"
btw = { path = ".", editable = true }
